<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Assistant</title>
<style>
  :root { --bg:#f5f6fa; --card:#fff; --ink:#1c2033; --muted:#6b7086; --brand:#3b4fd8; --brand-ink:#fff; --me:#e5e9ff; --line:#e3e5ef; --src:#f7f8fc; }
  @media (prefers-color-scheme: dark) { :root { --bg:#10121b; --card:#181b28; --ink:#e8eaf4; --muted:#979cb6; --brand:#7d8cff; --brand-ink:#0d1030; --me:#262c52; --line:#272b3d; --src:#1d2131; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:720px; margin:0 auto; height:100dvh; display:flex; flex-direction:column; padding:12px 16px; }
  header { padding:6px 0 12px; } header h1 { font-size:17px; margin:0; } header p { margin:2px 0 0; color:var(--muted); font-size:13px; }
  #log { flex:1; overflow-y:auto; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:88%; padding:10px 13px; border-radius:12px; white-space:pre-wrap; word-wrap:break-word; }
  .bot { background:var(--bg); align-self:flex-start; } .me { background:var(--me); align-self:flex-end; }
  details { margin-top:8px; font-size:13px; color:var(--muted); } summary { cursor:pointer; }
  .src { background:var(--src); border:1px solid var(--line); border-radius:8px; padding:7px 9px; margin-top:6px; white-space:normal; }
  .src b { color:var(--ink); }
  .fb { margin-top:6px; display:flex; gap:6px; } .fb button { border:1px solid var(--line); background:transparent; color:var(--muted); border-radius:6px; padding:2px 8px; cursor:pointer; font:inherit; font-size:12px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chips button { border:1px solid var(--brand); color:var(--brand); background:transparent; border-radius:999px; padding:5px 11px; font:inherit; font-size:13px; cursor:pointer; }
  form { display:flex; gap:8px; padding-top:10px; }
  input { flex:1; min-width:0; padding:11px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); font:inherit; }
  form button { padding:0 16px; border:0; border-radius:10px; background:var(--brand); color:var(--brand-ink); font:inherit; font-weight:600; cursor:pointer; }
  .typing { color:var(--muted); font-style:italic; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1 id="name">Student Assistant</h1><p>Answers come from the institute's own documents, with sources.</p></header>
  <div id="log" aria-live="polite"></div>
  <form id="f"><input id="q" placeholder="Ask about fees, batches, refunds, study tips…" autocomplete="off"><button>Ask</button></form>
</div>
<script>
const log = document.getElementById('log');
let sid; try { sid = localStorage.getItem('rag_sid'); } catch (e) {}
if (!sid) { sid = 's' + Math.random().toString(36).slice(2, 12); try { localStorage.setItem('rag_sid', sid); } catch (e) {} }
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const scroll = () => log.scrollTop = log.scrollHeight;

function botMsg(j) {
  const m = el('div', 'msg bot', j.answer);
  if (j.sources && j.sources.length) {
    const d = el('details'); d.appendChild(el('summary', null, `Sources (${j.sources.length})`));
    for (const s of j.sources) {
      const box = el('div', 'src'); const b = el('b', null, `[${s.n}] ${s.doc}${s.heading ? ' › ' + s.heading : ''}${s.page ? ' · p.' + s.page : ''}`);
      box.appendChild(b); box.appendChild(el('div', null, s.snippet)); d.appendChild(box);
    }
    m.appendChild(d);
  }
  if (j.question_id) {
    const fb = el('div', 'fb');
    for (const [label, ok] of [['Helpful', true], ['Not helpful', false]]) {
      const b = el('button', null, label);
      b.onclick = () => { fetch('/api/feedback', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ question_id: j.question_id, helpful: ok }) }); fb.textContent = 'Thanks for the feedback!'; };
      fb.appendChild(b);
    }
    m.appendChild(fb);
  }
  log.appendChild(m); scroll();
}
async function ask(text) {
  document.querySelectorAll('.chips').forEach(c => c.remove());
  log.appendChild(el('div', 'msg me', text));
  const t = el('div', 'msg bot typing', 'Searching documents…'); log.appendChild(t); scroll();
  try {
    const r = await fetch('/api/ask', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ session_id: sid, question: text }) });
    t.remove(); botMsg(await r.json());
  } catch (e) { t.textContent = 'Network problem, please try again.'; }
}
document.getElementById('f').onsubmit = e => { e.preventDefault(); const i = document.getElementById('q'); const v = i.value.trim(); if (v) { i.value = ''; ask(v); } };
fetch('/api/info').then(r => r.json()).then(i => { document.getElementById('name').textContent = i.name + ' · Student Assistant'; document.title = i.name; });
log.appendChild(el('div', 'msg bot', 'Hi! Ask me anything about courses, fees, batches, policies or study tips.'));
const chips = el('div', 'chips');
['What is the NEET fee?', 'Refund policy?', 'Evening batch timings', 'How do scholarships work?', 'Tips for mock tests'].forEach(q => { const b = el('button', null, q); b.type = 'button'; b.onclick = () => ask(q); chips.appendChild(b); });
log.appendChild(chips);
</script>
</body>
</html>
